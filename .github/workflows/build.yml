# Baut bei jeder Änderung automatisch:
#  1. die Web-Version und stellt sie auf GitHub Pages bereit
#  2. die Android-App (APK) und hängt sie an ein neues Release
name: Web & Android bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web-Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typprüfung (nur Hinweise)
        run: npx tsc --noEmit || echo "::warning::Typprüfung meldet Hinweise"
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    name: Auf GitHub Pages veröffentlichen
    needs: web
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android-App
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK prüfen (ist auf dem GitHub-Rechner vorinstalliert)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          cp -r android-res/* android/app/src/main/res/
          # Tastatur schiebt die Ansicht hoch statt Eingabefelder zu verdecken
          M=android/app/src/main/AndroidManifest.xml
          grep -q windowSoftInputMode $M || sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:windowSoftInputMode="adjustResize"/' $M
          grep -n "windowSoftInputMode" $M || echo "::warning::windowSoftInputMode nicht gesetzt"
          npx cap sync android

      - name: Versionsnummer setzen
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"2.2.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK signieren
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks android-signing/teamtime.keystore --ks-pass pass:teamtime --key-pass pass:teamtime --ks-key-alias teamtime --out TeamTime.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify TeamTime.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TeamTime-apk
          path: TeamTime.apk

      - name: Release mit APK anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: TeamTime 2.2.${{ github.run_number }}
          make_latest: true
          files: TeamTime.apk
          body: |
            **Android-App installieren:** `TeamTime.apk` unten herunterladen und auf dem Handy öffnen.
            Beim ersten Mal fragt Android, ob Installationen aus dieser Quelle erlaubt sind – einmal zulassen.
            Updates einfach drüberinstallieren, die Daten bleiben erhalten.

            Web-Version: https://cybermolch.github.io/TeamTime2/
